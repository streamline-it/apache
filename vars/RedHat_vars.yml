---
apache_pkg: "@Basic Web Server"
apache_web_svc: httpd

apache_enable_directive:

apache_group: apache

apache_virtual_hosts_directory: "/var/www/virtual_hosts"
apache_host_webcontent_directory_relative: /var/www/html
apache_virtual_host_webcontent_directory_relative: /var/www/virtual_hosts/apache_webserver_name/html
apache_default_webcontent_directory: "/var/www/html"
apache_config_directory: "/etc/httpd/conf/conf.d"
apache_certificate_file_path: "./files/{{ apache_webserver_name }}.crt"
apache_cert_destination_filepath: "/etc/pki/tls/certs/{{ apache_webserver_name }}.crt"
apache_certificate_key_file_path: "./files/{{ apache_webserver_name }}.key"
apache_key_destination_filepath: "/etc/pki/tls/private/{{ apache_webserver_name }}"

apache_create_cert_commands:
  cmd: "openssl genpkey -algorithm RSA -out /etc/pki/tls/private{{ apache_webserver_name }}.key"
  cmd: "openssl req -new -x509 -key /etc/pki/tls/private/{{ apache_webserver_name }}.key -out /etc/pki/tls/certs/{{ apache_webserver_name }}.crt -days 365"
