---
- name: make sure certificate file exists
  ansible.builtin.copy:
    src: "{{ apache_certificate_file_path }}"
    dest: "{{ apache_cert_destination }}"
    owner: root
    group: root
    mode: "0600"

- name: make sure hosts's certificate key file exists
  ansible.builtin.copy:
    src: "{{ apache_certificate_key_file_path }}"
    dest: "{{ apache_key_destination }}"
    owner: root
    group: root
    mode: "0600"
