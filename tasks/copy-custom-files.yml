---
- name: ensure each directory is created under the virtual hosts's directory
  when: apache_custom_filelist[0]['filename'] != ""
  loop:
    "{{ apache_custom_filelist }}"
  ansible.builtin.file:
    path: "{{ apache_virtual_hosts_directory }}/{{ item['dest_directory_name'] }}"
    owner: "{{ item['owner'] }}"
    group: "{{ item['group'] }}"
    mode: "{{ item['mode'] }}"   
    state: directory

- name: ensure custom files exist
  when: apache_custom_filelist[0]['filename'] != ""
  loop:
    "{{ apache_custom_filelist }}"
  ansible.builtin.copy:
    src:  "{{ item['filename'] }}"
    dest: "{{ apache_virtual_hosts_directory }}/{{ item['dest_directory_name'] }}"
    owner: "{{ item['owner'] }}"
    group: "{{ item['group'] }}"
    mode: "{{ item['mode'] }}"
