---
- name: check to see if certificates exist
  register: apache_main_host_certificate_check
  ansible.builtin.stat:
    path: "{{ apache_jail_prepath }}/usr/local/etc/apache24/{{ apache_main_hostname }}.crt"
    get_attributes: true
    
- name: check to see if virtual host's certificates exist
  register: apache_webserver_certificate_check
  ansible.builtin.stat:
    path: "{{ apache_jail_prepath }}/usr/local/etc/apache24/{{ apache_webserver_name }}.crt"
    get_attributes: true

- name: ensure certificates are created
  when: >
    apache_main_host_certificate_check['stat']['exists'] == false or
    apache_webserver_certificate_check['stat']['exists'] == false
  loop:
    "{{ apache_create_cert_commands }}"
  ansible.builtin.shell: "{{ item['command'] }}"
  args:
    creates: "{{ item['certfile'] }}"

- name: ensure certificate file are correctly setup with user/group permissions
  loop:
    - "{{ apache_cert_destination_filepath }}"
    - "{{ apache_cert_key_destination_filepath }}"
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: "{{ apache_group }}"
    mode: "0640"
