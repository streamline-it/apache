---
- name: ensure variables are defined before enabling/starting service
  ansible.builtin.assert:
    that: apache_svc is defined
    fail_msg: "Make sure to define apache_svc."

- name: make sure service is enabled/started (service)
  ansible.builtin.service:
    name: "{{ apache_svc }}"
    enbled: true
    state: started
  when: ansible_distribution_major_version == "6"
       
- name: make sure service is enabled/started (systemd)
  ansible.builtin.systemd:
    name: "{{ apache_svc }}"
    enabled: true
    state: started
  when: ansible_distribution_major_version == "7" 
    or ansible_distribution_major_version == "8"
    or ansible_distribution_major_version == "9"
