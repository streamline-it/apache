---
- name: make sure service is enabled/started (service)
  ansible.builtin.service:
    name: httpd
    enbled: true
    state: started
  when: ansible_distribution_major_version == "6"
       
- name: make sure service is enabled/started (systemd)
  ansible.builtin.systemd:
    name: httpd
    enabled: true
    state: started
  when: ansible_distribution_major_version == "7" 
    or ansible_distribution_major_version == "8"
    or ansible_distribution_major_version == "34"
