---
- name: make sure service is enabled for the host
  when: apache_jail_it == false
  community.general.sysrc:
    name: "{{ apache_svc }}"
    value: "yes"
    state: present

- name: make sure service is enabled for the jail
  when: apache_jail_it == true
  community.general.sysrc:
    name: "{{ apache_svc }}_enable"
    value: "yes"
    jail: "{{ apache_jailname }}"
    state: present

- name: ensure the service is started for the host *** ignore errors enabled - test mode ***
  when: apache_jail_it == false
  ignore_errors: true
  ansible.builtin.service:
    name: "{{ apache_svc }}"
    enabled: true
    state: started

- name: check if the service is started for the jail
  when: apache_jail_it == true
  ignore_errors: true
  register: jail_svc_status
  ansible.builtin.command:
    cmd: service -j "{{ apache_jailname }}" "{{ apache_svc }}" status

- name: ensure the service is started if it's not running in the jail
  when : apache_jail_it == true and jail_svc_status['stdout'] == "apache24 is not running."
  ansible.builtin.command:
    cmd: service -j "{{ apache_jailname }}" "{{ apache_svc }}" start
