---
# tasks file for apache
- name: ensure OS specific variables exists
  ansible.builtin.include_vars:
    "vars/{{ ansible_os_family }}_vars.yml"

- name: call tasks for assertions
  ansible.builtin.include_tasks: asserts.yml

- name: call tasks to make sure needed packages are installed
  when: apache_operation == "deploy"
  ansible.builtin.include_tasks: "./tasks/install_{{ ansible_os_family }}_pkgs.yml"

- name: make sure virtual hosts directory exists
  when: apache_operation == "deploy"
  ansible.builtin.file:
    path: "{{ apache_virtual_hosts_directory }}/{{ apache_webserver_name }}/html"
    owner: root
    group: "{{ apache_group }}"
    mode: "0750"
    state: directory

- name: ensure additional custom directories exist
  when: 
    - apache_operation == "deploy"
    - apache_create_custom_web_directories == true
  loop:
    "{{ apache_web_directories }}"
  ansible.builtin.file:
    path: "{{ apache_virtual_hosts_directory }}/{{ apache_webserver_name }}/{{ item['name'] }}"
    owner: "{{ item['owner'] }}"
    group: "{{ item['group'] }}"
    mode: "{{ item['mode'] }}"
    state: directory

- name: ensure httpd file is modified
  when: apache_httpd_conf_lines[0]['line'] is defined
  loop:
    "{{ apache_httpd_conf_lines }}"
  ansible.builtin.lineinfile:
    path: "{{ apache_config_base_directory }}/httpd.conf"
    line: "{{ item['line'] }}"
    state: present

- name: call tasks to make sure web content exists
  when: apache_operation == "deploy"
  ansible.builtin.include_tasks: "./tasks/deploy_web_content.yml"

- name: ensure default webserver's config exists
  when: apache_operation == "deploy"
  ansible.builtin.include_tasks: "./tasks/deploy_default_web_config.yml"

- name: call task to create certificates
  when: apache_operation == "deploy"
  ansible.builtin.include_tasks: "./tasks/create_cert_and_key_files.yml"
  
- name: call task to setup host's certificate/key files are setup
  when: ansible_os_family == "FreeBSD"
  ansible.builtin.include_tasks: "./tasks/config_main_host_certs_{{ ansible_os_family }}.yml"

- name: call tasks to deploy virtual host config
  when: apache_operation == "deploy"
  ansible.builtin.include_tasks: "./tasks/deploy_virtual_hosts_config.yml"

- name: call tasks make sure needed services are enabled/started
  ansible.builtin.include_tasks: "./tasks/start_{{ ansible_os_family }}_svc.yml"
  when: apache_operation == "deploy"

- name: call task to restart webserver
  ansible.builtin.include_tasks: "{{ ansible_os_family }}_restart_websvc.yml"
  when: apache_operation == "restart"

- name: call task to ensure webserver content is reachable
  ansible.builtin.include_tasks: "validate_webserver.yml"

- name: call task to ensure needed custom files exist
  ansible.builtin.include_tasks: "copy-custom-files.yml"
