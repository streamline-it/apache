---
- name: make sure apache package is installed (via dnf)
  ansible.builtin.dnf:
    name: "@Basic Web Server"
    update_cache: true
    state: latest
  when: ansible_distribution_major_version == "8"
        or ansible_distribution_major_version == "9"

- name: make sure apache package is installed (via yum)
  ansible.builtin.yum:
    name: "@Basic Web Server"
    update_cache: true
    state: latest
  when: ansible_distribution_major_version == "6"
        or ansible_distribution_major_version == "7"
