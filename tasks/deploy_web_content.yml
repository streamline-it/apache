---
- name: make sure default webserver's content exists
  when: apache_operation == "deploy"
  notify: restart webserver
  ansible.builtin.template:
    src: ./templates/default_webserver_index.html.j2
    dest: "{{ apache_default_webcontent_directory }}/index.html"
    owner: root
    group: "{{ apache_group }}"
    mode: "0640"
    force: true

- name: ensure webcontent directory exists for the virual host
  ansible.builtin.file:
    path: "{{ apache_virtual_hosts_webcontent_directory }}"
    owner: root
    group: "{{ apache_group }}"
    state: directory

- name: make sure virtual webserver's content exists
  when: apache_operation == "deploy"
  notify: restart webserver
  ansible.builtin.template:
    src: ./templates/virtual_webserver_index.html.j2
    dest: "{{ apache_virtual_hosts_directory }}/{{ apache_webserver_name }}/html/index.html"
    owner: root
    group: "{{ apache_group  }}"
    force: false
    mode: "0640"-
