---
- name: make sure apache package is installed on host
  when: apache_jail_it == false
  community.general.pkgng:
    name: "{{ apache_pkg }}"
    state: present

- name: make sure openssl package is installed on host
  when: apache_jail_it == false
  community.general.pkgng:
    name: "{{ apache_openssl_pkg }}"
    state: present

- name: make sure custom package(s) are installed on host
  when: 
    - apache_jail_it == false
    - apache_custom_pkgs | length > 0
  loop:
    "{{ apache_custom_pkgs }}"
  community.general.pkgng:
    name: "{{ item }}"
    state: present

# jails

- name: make sure apache package is installed in jail
  when: apache_jail_it == true
  community.general.pkgng:
    name: "{{ apache_pkg }}"
    jail: "{{ apache_jailname }}"
    state: present

- name: make sure openssl package is installed in jail
  when: apache_jail_it == true
  community.general.pkgng:
    name: "{{ apache_openssl_pkg }}"
    jail: "{{ apache_jailname }}"
    state: present

- name: make sure custom package(s) are installed in jail 
  when: 
    - apache_jail_it == true
    - apache_custom_pkgs | length > 0
  loop:
    "{{ apache_custom_pkgs }}"
  community.general.pkgng:
    name: "{{ item }}"
    jail: "{{ apache_jailname }}"
    state: present
