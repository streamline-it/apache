---
# defaults file for apache
apache_operation: deploy
apache_webserver_name: int_webserver

apache_jail_it: false

# leave next two variables blank unless installing in jail
apache_jailname: 
apache_jail_prepath:

apache_http_port: 80
apache_https_port: 443
apache_certificate_file_path: "./files/{{ apache_webserver_name }}.crt"
apache_certificate_key_file_path: "./files/{{ apache_webserver_name }}.key"
